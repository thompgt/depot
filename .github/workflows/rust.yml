name: rust

# No `paths:` filter. It looks like a saving until a README-only pull request passes
# with zero checks having run, and "green" then means two different things depending on
# what the diff touched. The whole matrix is a few cached minutes.
on: [push, pull_request]

# Read-only by default rather than whatever the repository's default happens to be:
# nothing here publishes, comments or tags, so nothing here needs to be able to.
permissions:
  contents: read

# One run per ref. Pushing three times in a minute should cost one CI run, not three,
# and the answer that matters is the one for the tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: rust

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc

  # The latency budget is only meaningful against an optimised build, and the
  # allocation guard is only meaningful against the code that actually ships.
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: latency budget
        run: cargo test --release --test latency -- --ignored --nocapture
      - name: allocation guard
        run: cargo test --release --test no_alloc

  # An advisory against a dependency of a safety layer should fail a build, not wait to
  # be noticed. Also enforces the licence allow-list and that everything comes from
  # crates.io — a git dependency slipping in is how a reviewed dependency stops being
  # the one that ships.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `rust/deny.toml` sits beside this manifest and is picked up from there.
          manifest-path: rust/Cargo.toml
          command: check advisories bans licenses sources

  # The declared MSRV is a promise to whoever links the library, so it is checked
  # against the library rather than the test suite: the dev-dependency graph
  # (proptest → getrandom) needs a far newer toolchain, and holding the tests to
  # 1.75 would mean choosing a weaker property-testing library to say so.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo check -p depot-safety-core --lib

  # The core must keep building for a bare-metal target with no allocator at all.
  # This is the check that stops `std` creeping back in one convenience at a time.
  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build -p depot-safety-core --target thumbv7em-none-eabihf --release
