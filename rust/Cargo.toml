[workspace]
resolver = "2"
members = ["depot-safety-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/tpequegnot/depot"

[workspace.lints.rust]
# Denied rather than forbidden so the allocation-guard test can opt in: proving the
# core never allocates requires a custom global allocator, which requires `unsafe`.
# The library crate itself still carries `#![forbid(unsafe_code)]`.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
float_cmp = "warn"
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
overflow-checks = true
debug = true
